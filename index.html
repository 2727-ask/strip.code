<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>StripCode</title>
    <meta name="description" content="StripCode: solve coding problems to make her strip. Adults only (18+).">
    <meta name="rating" content="adult">
    <meta name="theme-color" content="#0a030f">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Critical styles, inline so nothing flashes white or shows before the age gate -->
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0a030f;
            font-family: 'Poppins', system-ui, sans-serif;
        }

        /* The site loads in the background, laid out but invisible, until the gate lifts */
        body:not(.entered) #app {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <!-- The age gate: the only thing that loads before the visitor says yes -->
    <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" data-state="ask">
        <div class="gate-glow" aria-hidden="true"></div>

        <div class="gate-inner">
            <!-- the flickering neon sign is drawn here by gate.js -->
            <div id="gate-sign" class="gate-sign" role="img" aria-label="StripCode"></div>

            <section class="gate-view" data-view="ask">
                <h1 id="gate-title" tabindex="-1">Are you over 18?</h1>
                <p class="gate-note">StripCode is for adults only. Enter only if you are 18 or older.</p>
                <div class="gate-actions">
                    <button id="gate-yes" class="gate-btn yes" type="button">Yes, I'm 18+</button>
                    <button id="gate-no" class="gate-btn no" type="button">No, take me out</button>
                </div>
            </section>

            <section class="gate-view" data-view="load" hidden>
                <h1 class="gate-heading">Getting the stage ready</h1>
                <div class="neon-bar" role="progressbar" aria-labelledby="gate-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <i></i>
                </div>
                <p class="gate-status"><span id="gate-label">Starting</span><b id="gate-percent">0%</b></p>
            </section>

            <section class="gate-view" data-view="denied" hidden>
                <h1 class="gate-heading">Come back when you're 18</h1>
                <p class="gate-note">Sorry, StripCode is only for adults.</p>
            </section>

            <section class="gate-view" data-view="error" hidden>
                <h1 class="gate-heading">Something went wrong</h1>
                <p class="gate-note" id="gate-error-text">The site could not finish loading.</p>
                <div class="gate-actions">
                    <button id="gate-retry" class="gate-btn yes" type="button">Try again</button>
                </div>
            </section>

            <noscript><p class="gate-note">StripCode needs JavaScript to run.</p></noscript>
        </div>
    </div>

    <!-- The site itself. It starts loading when the visitor confirms their age. -->
    <div id="app">
        <div id="stage">
            <div id="progress"></div>

            <!-- the 3D canvas is added here -->
            <div id="viewport">
                <div id="controls">
                    <button id="danceBtn" type="button" title="Change Dance" aria-label="Change Dance" disabled>
                        <!-- music note -->
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 18V5l12-2v13"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <aside id="panel"></aside>
    </div>

    <script type="module" src="/src/gate.js"></script>
</body>
</html>
